name: API checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test against PostgreSQL
        run: docker compose --profile test run --build --rm test
      - name: Start API and wait for readiness
        run: docker compose up --build -d --wait api
      - name: Exercise the public API
        run: docker compose exec -T api .venv/bin/python -m scripts.walkthrough
      - name: Show container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color db migrate api
      - name: Clean up containers and test data
        if: always()
        run: docker compose down --volumes
